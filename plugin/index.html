<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Decupa</h1>
      <span class="sub">corte automático de silêncios</span>
    </header>

    <section>
      <h2>1. Áudio</h2>
      <div class="preset">
        <span id="presetName" class="muted">Nenhum preset WAV escolhido</span>
        <button id="btnPreset" class="ghost">Escolher…</button>
      </div>
      <p class="hint">Trilhas mutadas (ex.: música) são ignoradas na análise.</p>
      <button id="btnAnalyze" class="primary">Analisar sequência ativa</button>
    </section>

    <section id="paramsSection" class="disabled">
      <h2>2. Ajustes</h2>

      <div class="field">
        <div class="label-row">
          <label for="threshold">Limiar de silêncio</label>
          <span><span id="thresholdVal">-40</span> dB</span>
        </div>
        <div class="slider-row">
          <input id="threshold" type="range" min="-70" max="-10" step="1" value="-40" />
          <button id="btnAuto" class="ghost small">Auto</button>
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="minSilence">Duração mínima do silêncio</label>
          <span><span id="minSilenceVal">0.50</span> s</span>
        </div>
        <input id="minSilence" type="range" min="0.1" max="3" step="0.05" value="0.5" />
      </div>

      <div class="field">
        <div class="label-row">
          <label for="padBefore">Margem antes da fala</label>
          <span><span id="padBeforeVal">0.10</span> s</span>
        </div>
        <input id="padBefore" type="range" min="0" max="0.5" step="0.01" value="0.1" />
      </div>

      <div class="field">
        <div class="label-row">
          <label for="padAfter">Margem depois da fala</label>
          <span><span id="padAfterVal">0.15</span> s</span>
        </div>
        <input id="padAfter" type="range" min="0" max="0.5" step="0.01" value="0.15" />
      </div>

      <div class="field">
        <div class="label-row">
          <label for="minSpeech">Ignorar ruídos mais curtos que</label>
          <span><span id="minSpeechVal">0.10</span> s</span>
        </div>
        <input id="minSpeech" type="range" min="0" max="0.5" step="0.01" value="0.1" />
      </div>

      <div id="preview" class="preview"><div id="previewRegions"></div></div>
      <div class="stats">
        <div><strong id="statCount">0</strong><span>cortes</span></div>
        <div><strong id="statRemoved">0:00</strong><span>removido</span></div>
        <div><strong id="statRemaining">0:00</strong><span>resultado</span></div>
      </div>
    </section>

    <section id="applySection" class="disabled">
      <h2>3. Aplicar</h2>
      <div class="field">
        <label for="mode">Ação</label>
        <select id="mode">
          <option value="remove">Remover silêncios (ripple)</option>
          <option value="disable">Desativar trechos silenciosos</option>
          <option value="mark">Só marcar com marcadores</option>
        </select>
      </div>
      <label class="check">
        <input id="useCopy" type="checkbox" checked />
        Trabalhar numa cópia da sequência
      </label>
      <button id="btnApply" class="primary">Aplicar cortes</button>
    </section>

    <div id="progress" class="progress hidden"><div id="progressBar"></div></div>
    <p id="status" class="status"></p>

    <script src="main.js"></script>
  </body>
</html>
